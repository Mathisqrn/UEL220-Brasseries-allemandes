<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasseries d'Allemagne</title>
    <!-- Polices de la charte (Google Fonts) -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- Feuille de style du site -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
        <h1>Brasseries d'Allemagne</h1>
    </header>
    <main>
        <form id="formulaire">
            <label>Ville :
                <input type="text" id="ville" placeholder="Berlin">
            </label>
            <label>Land :
                <select name="land" id="land">
                    <option value="">Tous</option>
                    <option value="Baden-Württemberg">Baden-Württemberg</option>
                    <option value="Bayern">Bayern</option>
                    <option value="Berlin">Berlin</option>
                    <option value="Brandenburg">Brandenburg</option>
                    <option value="Bremen">Bremen</option>
                    <option value="Hamburg">Hamburg</option>
                    <option value="Hessen">Hessen</option>
                    <option value="Mecklenburg-Vorpommern">Mecklenburg-Vorpommern</option>
                    <option value="Niedersachsen">Niedersachsen</option>
                    <option value="Nordrhein-Westfalen">Nordrhein-Westfalen</option>
                    <option value="Rheinland-Pfalz">Rheinland-Pfalz</option>
                    <option value="Saarland">Saarland</option>
                    <option value="Sachsen">Sachsen</option>
                    <option value="Sachsen-Anhalt">Sachsen-Anhalt</option>
                    <option value="Schleswig-Holstein">Schleswig-Holstein</option>
                    <option value="Thüringen">Thüringen</option>
                </select>
            </label>
            <label>Type :
                <select id="type">
                    <option value="">Tous</option>
                    <option value="bar">Bar</option>
                    <option value="micro">Micro-brasserie</option>
                    <option value="brewpub">Brewpub</option>
                    <option value="beergarden">Biergarten</option>
                    <option value="large">Grande brasserie</option>
                </select>
            </label>

            <label>Nombre de recherche : 
                <select name="nombre" id="nombre">
                    <option value="5">5</option>
                    <option value="10">10</option>
                </select>
            </label>
            <button type="submit">Rechercher</button>
        </form>

        <p id="message"></p>
        <div id="resultats"></div>
    </main>
    <script src="assets/js/jquery-4.0.0.js"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
