<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasseries d'Allemagne</title>
    <!-- Polices de la charte (Google Fonts) -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- Feuille de style du site -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Feuille de style de la carte leaflet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>

<body>
    <header>
        <img src="assets/ressources/images/logo.png" alt="logo : aigle tenant une chope de bière">
        <div class="header-texte">
            <h1>Brasseries d'Allemagne</h1>
            <p>Trouvez une brasserie partout en Allemagne</p>
        </div>
    </header>
    <main>
        <form id="formulaire">
            <label>Ville :
                <input type="text" id="ville" placeholder="Berlin">
            </label>
            <label>Land :
                <select name="land" id="land">
                    <option value="">Tous</option>
                    <option value="Baden-Württemberg">Baden-Württemberg</option>
                    <option value="Bayern">Bayern</option>
                    <option value="Berlin">Berlin</option>
                    <option value="Brandenburg">Brandenburg</option>
                    <option value="Bremen">Bremen</option>
                    <option value="Hamburg">Hamburg</option>
                    <option value="Hessen">Hessen</option>
                    <option value="Mecklenburg-Vorpommern">Mecklenburg-Vorpommern</option>
                    <option value="Niedersachsen">Niedersachsen</option>
                    <option value="Nordrhein-Westfalen">Nordrhein-Westfalen</option>
                    <option value="Rheinland-Pfalz">Rheinland-Pfalz</option>
                    <option value="Saarland">Saarland</option>
                    <option value="Sachsen">Sachsen</option>
                    <option value="Sachsen-Anhalt">Sachsen-Anhalt</option>
                    <option value="Schleswig-Holstein">Schleswig-Holstein</option>
                    <option value="Thüringen">Thüringen</option>
                </select>
            </label>
            <label>Type :
                <select id="type">
                    <option value="">Tous</option>
                    <option value="bar">Bar</option>
                    <option value="micro">Micro-brasserie</option>
                    <option value="brewpub">Brewpub</option>
                    <option value="beergarden">Biergarten</option>
                    <option value="large">Grande brasserie</option>
                </select>
            </label>

            <label>Nombre de résultats :
                <select name="number" id="number">
                    <option value="5">5</option>
                    <option selected value="10">10</option>
                </select>
            </label>
            <button type="submit">Rechercher</button>
        </form>

        <div class="actions">
            <button id="aleatoire" type="button">Brasserie au hasard</button>
            <button id="proche" type="button">Brasseries les plus proches</button>
            <button id="itineraire" type="button">Créer l’itinéraire</button>
        </div>
        <!--On fait apparaitre ici les messages de réussite, d'erreur ou de chargement-->
        <p id="message"></p>

        <!--Carte leaflet avec les marqueurs-->
        <div id="carte-leaflet"></div>

        <!-- Là où apparaissent les cartes-->
        <div id="resultats"></div>
    </main>
    <footer>
        <span>Projet UE L220 – Groupe 6 : Jesse, Valentin et Mathis</span>
        <p>Données : <a href="https://openbrewerydb.org/" target="_blank">Open Brewery DB </a></p>
        <p>Fonds de carte © OpenStreetMap</p>
    </footer>

    <!-- Importe le fichier jquery -->
    <script src="assets/js/jquery-4.0.0.js"></script>
    <!-- Importe le fichier pour la carte leaflet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
